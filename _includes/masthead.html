<header class="folio-masthead">
  <div class="site-frame folio-masthead-inner">
    <a class="folio-signature" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <span lang="zh-CN">张昊</span><span lang="en">Hao Zhang</span>
    </a>
    <nav aria-label="主导航 · Main navigation" class="folio-nav">
      {% for link in site.data.navigation.main %}
        {% assign names = link.title | split: ' · ' %}
        <a href="{{ link.url | relative_url }}"{% if link.url == page.url %} aria-current="page"{% elsif link.url == '/portfolio/' and page.collection == 'portfolio' %} aria-current="location"{% endif %}>
          <span lang="zh-CN">{{ names | first | escape }}</span>{% if names.size > 1 %}<span lang="en">{{ names | last | escape }}</span>{% endif %}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>
