{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">

<link rel="stylesheet" media="screen" href="{{ '/assets/css/field-notes.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.url == '/' %}<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
{% if page.url == '/portfolio/' or page.collection == 'portfolio' %}<link rel="stylesheet" href="{{ '/assets/css/projects.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}

<meta http-equiv="cleartype" content="on">
